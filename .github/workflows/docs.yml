name: Documentation
on:
  push:
    branches: [main]  # Changed from master to main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  docs:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Changed from read to write for deployment
      statuses: write
      pages: write     # Added for GitHub Pages
      id-token: write  # Added for GitHub Pages
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Install Dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Removed DOCUMENTER_KEY - using GitHub token instead
        run: julia --project=docs docs/make.jl
